<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>车辆模型总览 · ETC 数字孪生</title>
    <link rel="stylesheet" href="./vehicles.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <header class="gallery-head">
      <h1>车辆模型总览</h1>
      <p class="dim">按部标车型码建模：车型、轴数、实测长宽高都来自日志；车身颜色日志不可靠，这里按车型给了一组示意配色。</p>
      <p class="links">
        <a class="link" href="./index.html">← 单车通行回放</a>
        <a class="link" href="./lanes.html">多车道过程 →</a>
      </p>
    </header>
    <div class="gallery-hud">
      <button id="resetView" type="button">重置视角</button>
      <button id="spinToggle" type="button">自动旋转</button>
      <span class="gpu-badge" id="gpuBadge"></span>
    </div>
    <script>
      window.__ERRORS__ = [];
      window.addEventListener("error", (event) => window.__ERRORS__.push(String(event.message || event.error)));
      window.addEventListener("unhandledrejection", (event) => window.__ERRORS__.push("rejection: " + event.reason));
      (function () {
        let clock = 0;
        window.requestAnimationFrame = function (callback) {
          return setTimeout(function () { clock += 16.7; callback(clock); }, 8);
        };
        window.cancelAnimationFrame = function (id) { clearTimeout(id); };
        const realNow = performance.now.bind(performance);
        performance.now = function () { return clock || realNow(); };
        Object.defineProperty(document, "hidden", { get: () => false });
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./vehicles.js"></script>
    <script type="module" src="./_gprobe.js"></script>
  </body>
</html>
