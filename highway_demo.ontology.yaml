        required: false
        description: B4 帧时间（用户标注，设备控制服务）。OBU 内车辆信息确认帧，0015/0019/EF01/EF04 均含车牌（建议取 0015 的 vlp）
      - name: b5_frame_time
        display_name: B5帧时间
        data_type: date
        required: false
        description: B5 帧时间（用户标注，设备控制服务）。OBU 交易成功确认帧；交易耗时 C2 = b5_frame_time − b2_frame_time（落库对应 xp_time）
      - name: c2_frame_time
        display_name: C2帧时间
        data_type: date
        required: false
        description: C2 区间原始证据（帧到达时刻，用户标注设备控制服务）。方案 4.2 明确 C2 是 B2–B5 耗时、不是单点时间，本列只作区间起止的旁证，勿当独立时间节点
      - name: c6_frame_time
        display_name: C6帧时间
        data_type: date
        required: false
        description: C6 帧时间（用户标注，设备控制服务）；帧类型定义未在现有依据（设备表 E1–EC、时间语义字典、实测日志）中出现，语义未确认
      - name: a1_frame_time
        display_name: A1帧时间
        data_type: date
        required: false
        description: A1 帧时间（用户标注，设备控制服务），对应时间节点 A1（车辆压到存在线圈/车辆到达），存在线圈位置为 ETC 车道 1 号线圈、混合车道 6 号线圈。混合车道 T1 优先取值；ETC 专用车道禁用该节点
      - name: ba_frame_time
        display_name: BA帧时间
        data_type: date
        required: false
        description: BA 帧时间（用户标注，设备控制服务）；帧类型定义未在现有依据中出现，语义未确认
      - name: e1_frame_time
        display_name: E1帧时间
        data_type: date
        required: false
        description: E1 帧时间（用户标注，设备控制服务）。外场控制服务交易处理帧，携带 errorCode 与失败原因（样例「货车不允通行」）
      - name: b2_errcode
        display_name: B2错误码
        data_type: int
        required: false
        description: B2 帧错误码（用户标注，设备控制服务）。本次补充属性，提供的 DDL 中尚无对应列，需确认已加列或由帧解析回填
      - name: b4_errcode
        display_name: B4错误码
        data_type: int
        required: false
        description: B4 帧错误码（用户标注，设备控制服务）。本次补充属性，提供的 DDL 中尚无对应列，需确认已加列或由帧解析回填
      - name: b5_errcode
        display_name: B5错误码
        data_type: int
        required: false
        description: B5 帧错误码（用户标注，设备控制服务）。本次补充属性，提供的 DDL 中尚无对应列，需确认已加列或由帧解析回填
      - name: c2_errcode
        display_name: C2错误码
        data_type: int
        required: false
        description: C2 帧错误码（用户标注，设备控制服务）。本次补充属性，提供的 DDL 中尚无对应列，需确认已加列或由帧解析回填
      - name: c6_errcode
        display_name: C6错误码
        data_type: int
        required: false
        description: C6 帧错误码（用户标注，设备控制服务）。本次补充属性，提供的 DDL 中尚无对应列，需确认已加列或由帧解析回填

    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: id
      field_mapping:
        pass_record_id: id
        b2_frame_time: b2_frame_time
        b4_frame_time: b4_frame_time
        b5_frame_time: b5_frame_time
        c2_frame_time: c2_frame_time
        c6_frame_time: c6_frame_time
        a1_frame_time: a1_frame_time
        ba_frame_time: ba_frame_time
        e1_frame_time: e1_frame_time
        b2_errcode: b2_errcode
        b4_errcode: b4_errcode
        b5_errcode: b5_errcode
        c2_errcode: c2_errcode
