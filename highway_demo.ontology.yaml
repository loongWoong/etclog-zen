# ═══════════════════════════════════════════════════════════════════════════
# 关系边（29 条）：设施/车辆/介质/硬件设备/软件服务 → 过车记录，服务驱动设备与服务编排，
#   以及原本体的业务结果/规则/日志关系。property_mappings 键=源属性、值=目标属性。
# ═══════════════════════════════════════════════════════════════════════════

link_types:

  - name: vehicle_participates_pass_record
