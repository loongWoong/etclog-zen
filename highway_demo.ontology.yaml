functions:
  - name: calculate_toll_fee
    display_name: 计算通行费
    description: 基于过车记录中的出入信息、费率车型、通行介质与计费服务结果，核算应收/实收金额并给出偏差。输入取 fee（应收）、pay_fee（实收）、actual_fee_class、vehicle_type、billing_req_time/billing_resp_time。
    implementation: java
    script_path: highway_demo.ontology/calculate_toll_fee.java
    input:
      - name: passRecord
        type: Map<String,Object>
      - name: relatedServices
        type: List<Map<String,Object>>
      - name: relatedMedium
        type: Map<String,Object>
    output:
      type: Map<String,Object>

  - name: analyze_traffic_flow
    display_name: 通行流量分析
    description: 基于过车记录与业务结果，分析车道流量、特情发生率及平均通行时间；分组键为 lane_hex + vehicle_type，耗时取 elapsed_barrier_ms/elapsed_pass_ms。
    implementation: java
    script_path: highway_demo.ontology/analyze_traffic_flow.java
    input:
      - name: passRecords
        type: List<Map<String,Object>>
      - name: businessResults
        type: List<Map<String,Object>>
    output:
      type: Map<String,Object>

  - name: compute_pass_time_nodes
    display_name: 过车时间节点与耗时计算
    description: >
      由过车记录计算时间节点与耗时：T1 车辆到达（混合车道取 a1_frame_time，缺失退
      min(plate_capture_time, b2_frame_time)；ETC 专用车道取 min(plate_capture_time, b2_frame_time)）、
      T2=gate_open_time（抬杆请求）、T3=gate_finish_time（抬杆到位）、T4=detector7_time、
      C2=b5_frame_time−b2_frame_time（落库等价列为 xp_time）；输出 elapsedBarrierMs(T3−T1)、
      elapsedPassMs(T4−T1)、elapsedTradeMs(C2 或 xp_time)、t3Trusted(T3−T2 ≥ a1=20ms) 与
      缺失节点标记 MISSING(node)。口径见方案 4.2/5.2。
    implementation: java
    script_path: highway_demo.ontology/compute_pass_time_nodes.java
    input:
      - name: passRecord
        type: Map<String,Object>
    output:
      type: Map<String,Object>

  - name: check_flow_integrity
    display_name: 流水完整性与上传延迟校验
    description: >
      校验流水关键字段完整性与上传延迟：trade_id/pass_id/waste_id 缺失分别记为无交易流水、
      无过车标识、无流水（waste_id）；full_tolling_save_time 与 redis_save_time 之差超过
      5 分钟记为"上传延迟流水"，并结合关联日志定位网络超时/重试/服务异常等原因。
    implementation: java
    script_path: highway_demo.ontology/check_flow_integrity.java
    input:
      - name: passRecord
        type: Map<String,Object>
      - name: relatedLogs
        type: List<Map<String,Object>>
    output:
      type: Map<String,Object>

# ═══════════════════════════════════════════════════════════════════════════
# 规则（函数封装）
# ═══════════════════════════════════════════════════════════════════════════


rules:
  - name: pass_record_fee_abnormal
    display_name: 通行费异常预警
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ calculate_toll_fee(?r, "fee_abnormal", true)
      → has_abnormal_reason(?r, "计算出的通行费与基础费率偏差过大，可能存在计费异常")
    output_type: warning
  - name: pass_record_traffic_jam
    display_name: 车道拥堵风险
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ analyze_traffic_flow(?r, "traffic_jam", true)
      → has_abnormal_reason(?r, "当前车道通行记录激增，可能存在拥堵风险")
    output_type: context
  - name: pass_record_special_event
    display_name: 特情处理提醒
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ has_result(?r, "特情记录")
      → has_abnormal_reason(?r, "该通行记录包含特情，需人工介入核查")
    output_type: warning
  - name: pass_record_trade_failed
    display_name: 交易失败需重新处理
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ has_result(?r, "交易结果", "失败")
      → has_abnormal_reason(?r, "扣费交易失败，需重新发起交易或转人工处理")
    output_type: context
  - name: pass_record_slow_pass
    display_name: 过车慢判定
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ compute_pass_time_nodes(?r, "slow_pass", true)
      → has_abnormal_reason(?r, "T3 可信时 T3−T1 超过 b1、T3 不可信时 T4−T1 超过 b2，判定为过车慢")
    output_type: warning
  - name: pass_record_t3_untrusted
    display_name: 抬杆到位不可信
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ compute_pass_time_nodes(?r, "t3_untrusted", true)
      → has_abnormal_reason(?r, "T3−T2 小于 a1（20ms），抬杆到位信号缺失或异常，耗时改用 T4−T1 口径")
    output_type: context
  - name: pass_record_time_node_missing
    display_name: 关键时间节点缺失
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ compute_pass_time_nodes(?r, "node_missing", true)
      → has_abnormal_reason(?r, "T1/T2/T3/T4 中存在缺失节点，显式标记 MISSING 且不参与耗时基线样本")
    output_type: context
  - name: pass_record_flow_delay
    display_name: 流水上传延迟
    language: swrl
    expr: >-
      VehiclePassRecord(?r) ∧ check_flow_integrity(?r, "upload_delay", true)
      → has_abnormal_reason(?r, "流水生成到入库（接收）超过 5 分钟，需按关联日志定位网络/重试/服务异常")
    output_type: warning


# ═══════════════════════════════════════════════════════════════════════════
# 口径与待确认（纯注释，不影响解析）
# ═══════════════════════════════════════════════════════════════════════════
# 1) 时间节点口径：A1=车辆压到存在线圈、B1=抓拍时间、C1=首个 B2 帧、C2=B5−B2（落库 xp_time）、
#    T2=gate_open_time 抬杆请求、T3=gate_finish_time 抬杆到位（禁用 E4 回声行）、T4=车检器7。
#    见《交易日志监测和分析系统方案设计V2.1》4.2、《本体分析方案与实例规格V1》2.2 与 5.2。
# 2) 用户标注已消解三项旧待确认：xp_time=B2-B5 耗时（交易服务）、cpc_time=CPC 卡交易耗时、
#    gate_open/finish=抬杆请求/到位；waste_id/waste_generate_time 按"流水ID/流水生成时间"理解，
#    error_code 按"交易特情码"理解。
# 3) 本表无通行方向列（入口/出口）、无入口站与入口时间；direction、EnStation/EnTime 需由站级流水
#    或位元实体（ext_attributes）回填，方案中 laneDirection 整月为空。
# 4) 金额：fee=费用/应收、pay_fee=实收/支付费用；本站样例 pay_fee(5318) 大于 fee(4520)，差额 798
#    与计费响应 discountFee 一致，故库内单位（分/元）与折前折后归属仍须生产字段字典确认。
# 5) 除 vehicle_pass_record 外，BusinessResult/BusinessRule/LogRecord 及其关系表沿用原本体定义，
#    本次未提供其 DDL，落地时按生产库/日志源校正。
# 6) redis_save_time 归交易服务（沿用用户标注的 ETC 交易服务口径）；若按"Redis 入库"语义应归
#    消息缓存服务，请确认后调整（新增的 MessageCacheService 已存在）。
# 7) 码表类取值（plate_color、media_type、pay_type、lane_type 的混合车道等取值）现有依据只覆盖
#    本站样例值，须以生产编码表补齐；ba/c6 帧类型定义仍缺失。
# 8) 规则头谓词 has_abnormal_reason / has_result 沿用原本体命名，未声明为 link_type 或属性，
#    按开放词表处理；has_result 语义上等同 pass_record_generates_result 的谓词形式。
# 9) script_path 采用「数据源 id + .ontology/」前缀 highway_demo.ontology/（沿用原本体约定），
#    与 namespace com.highway.ontology 不是同一套命名；Java 实现尚未提供。
# 10) 对象归属实现方式：每列由"同名物理属性"唯一归属一个对象（全文件只出现一次）；派生属性是
#     别名映射（vehicle_id→plate_no、medium_id→media_no、entry_time→a1_frame_time、
#     exit_time→detector7_time、total_fee→fee、status→error_code），可跨对象引用载体列。
# 11) 硬件/软件服务对象均为归集表同行投影：主键属性 pass_record_id 映射 vehicle_pass_record.id，
#     同一次通行的设备/服务侧取值即该行；设备实例标识（车检器编号/栏杆机编号/屏号/RSU 编号）
#     需车道设备字典补全后才能建成独立主数据对象。
# 12) 5 个 *_errcode（B2/B4/B5/C2/C6）为补充属性，提供的 62 列 DDL 中尚无对应列，落地前须确认
#     是新增列还是由帧解析回填；其 field_mapping 目前指向同名占位列。
# 13) 第 3 组已按「设施 / 硬件设备 / 软件服务」拆为独立对象：设施=收费站、收费车道；硬件=车辆检测器、
#     车牌识别设备、RSU 读写单元、栏杆机、显示屏/信号灯；服务=计费、交易、授权、消息缓存、设备控制、
#     车道前端。FacilityAndService、Device、SoftwareService 不再单独存在；如需"硬件设备/软件服务"
#     基类（parent_object_types + base_type）请告知——平台上关系端点必须声明在 object_types 中，
#     不能用基类做端点，故关系按具体类型逐一声明（共 29 条）。
# 14) 归集表无专属列的 4 个对象：RsuUnit、DisplaySignalUnit、AuthorizationService、LaneFrontendService，
#     目前仅含同行投影主键 pass_record_id，其证据由帧时间（设备控制服务）、特情码、抬杆时间间接体现；
#     若补齐 RSU 编号/屏号/授权结果/前端心跳等字段，可再挂属性。
# 15) 关系属性映射遵循平台口径「键=源属性，值=目标属性」：硬件/服务→通行记录 11 条用
#     {pass_record_id: id}，服务→设备与服务→服务 8 条用 {pass_record_id: pass_record_id}，
#     业务结果/日志 3 条用 {id: record_id|result_id}，共 22 条已配置；
#     收费站/车道/车辆/介质与通行记录之间因拆分后两侧无同名列，未配置映射——需要的话可把
#     station_id/lane_hex/plate_no/media_no 挂回聚合根，或在维度对象上加 pass_record_id 镜像属性。
# 16) 平台导入约束（已本地镜像校验）：每个对象恰好一个 primary_key: true；对象 display_name≤42 且不含
#     空格、description≤100；属性 name/display_name≤64、description≤1000；关系 display_name≤128；
#     cardinality 仅 one-to-one / one-to-many / many-to-one（direction 由后端固定 directed）。
# 17) work_date 标注为 DATETIME、物理列为 date，按日期粒度归一；axle_count 标注 TINYINT、物理列为
#     int2，统一映射为 int。Station/Lane/Vehicle/TollMedium 的主键属性 required=false 与 DDL 可空性一致。
