    display_name: 设备控制服务
    description: 设备控制服务（软件）：B2/B4/B5/C2/C6/A1/BA/E1 帧交互与帧错误码，汇聚各设备指令。
    role: fact
    properties:
      - name: pass_record_id
        display_name: 通行记录标识
        data_type: string
        required: true
        unique: true
        primary_key: true
        description: 同行投影的行身份，取 vehicle_pass_record.id，用于与通行记录建立关联
      - name: b2_frame_time
        display_name: B2帧时间
        data_type: date
        required: false
        description: B2 帧时间（用户标注，设备控制服务）。RSU 与 OBU 完成信息交互后上报的关键数据帧（含 OBU 信息与交易状态），对应时间节点 C1（天线扫描到 OBU）
