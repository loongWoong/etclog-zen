    source_type: Vehicle
    target_type: VehiclePassRecord
    cardinality: one-to-many
    direction: directed
    property_mappings: {}
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      source_id_column: plate_no
      target_id_column: id
      field_mapping: {}

  - name: vehicle_has_medium
    display_name: 车辆持有通行介质
    description: 一辆车辆可持有/标识多个通行介质（OBU、ETC卡、CPC卡、车牌）；同为车辆下属对象，以 plate_no → media_no 关联。
    source_type: Vehicle
    target_type: TollMedium
    cardinality: one-to-many
    direction: directed
    property_mappings: {}
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      source_id_column: plate_no
      target_id_column: media_no
      field_mapping: {}

  - name: pass_record_uses_medium
    display_name: 通行记录使用通行介质
