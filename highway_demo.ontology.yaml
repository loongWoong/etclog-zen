# ═══════════════════════════════════════════════════════════════════════════
# 高速公路 ETC 车道过车记录本体  highway_demo.ontology
# ───────────────────────────────────────────────────────────────────────────
# 生成依据（四合一）：
#   1) 原本体：com.highway.ontology 的对象类型/关系/函数/规则
#   2) 物理结构：PostgreSQL 表 public.vehicle_pass_record（62 列，见 vehicle_pass_record.ddl.sql）
#   3) 日志口径：《交易日志监测和分析系统方案设计V2.1》4.2 时间节点表
#                《本体分析方案与实例规格V1》2.2 时间语义字典 / 5.2 T1 与两个耗时
#   4) 对象归属：用户《高速日志归集表与对象关系标注》5 组对象 + 第 3 组按
#                「设施 / 硬件设备 / 软件服务」单独拆分（本轮重构）
#
# 对象清单（每列只归属一个对象；同名物理属性在全文件中只出现一次）：
#   过车记录·整体对象  VehiclePassRecord  id/pass_id/trade_id/waste_id + 审计列 + 派生
#   设施  Station 收费站      station_id/station_name
#         Lane    收费车道    lane_id/lane_hex/lane_type
#   车辆与介质  Vehicle 车辆  plate_no…axle_type
#         TollMedium 通行介质  obu_id/obu_mac/obu_serial_number/card_no/media_no/media_type
#   硬件设备  VehicleDetector         车辆检测器  detector1|2|6|7 信号与离开时间
#         PlateRecognitionDevice 车牌识别设备  plate_capture_time/plate_capture_plate
#         RsuUnit                RSU读写单元  （本表无专属列，仅同行投影主键）
#         BarrierGate            栏杆机      gate_open_time/gate_finish_time
#         DisplaySignalUnit      显示屏信号灯 （本表无专属列，仅同行投影主键）
#   软件服务  BillingService        计费服务  billing_*/pay_*/trans_time/pay_type/fee/pay_fee
#         TradeService          交易服务  xp_time/cpc_time/full_tolling_save_time/
#                                        redis_save_time/error_code/batch_num/shift/work_date
#         AuthorizationService  授权服务  （本表无专属列，仅同行投影主键）
#         MessageCacheService   消息缓存服务  waste_generate_time
#         DeviceControlService  设备控制服务  b2…e1 帧时间与 5 个帧错误码
#         LaneFrontendService   车道前端服务  （本表无专属列，仅同行投影主键）
#   原本体保留  BusinessResult / BusinessRule / LogRecord（演示库表）
#
# 投影说明：Station/Lane/Vehicle/TollMedium 及全部硬件/服务对象的数据源都是归集表
#   vehicle_pass_record（同表投影）。硬件与服务对象的行身份用属性 pass_record_id
#   （→ vehicle_pass_record.id）作主键；除该表外的对象/关系表沿用原本体定义。
#   FacilityAndService、Device、SoftwareService 三个粗粒度对象已被上述细分对象取代。
#
# 映射约定：
#   · 属性名 = 物理列名（DDL 原样小写），field_mapping 为同名映射；派生属性为别名映射
#   · required 与 DDL 的 NOT NULL 对齐；timestamp→date、int2/int4/tinyint→int、varchar/text→string
#   · 5 个 *_errcode 为本次补充属性，提供的 DDL 中尚无对应列（见文末第 12 条）
#   · 每个对象恰有一个 primary_key: true 属性（平台保存强约束）
# ═══════════════════════════════════════════════════════════════════════════
version: "1.0"
namespace: com.highway.ontology

data_sources:
  - id: "highway_demo"
    type: postgresql
    database: highway_demo
    jdbc_url: "jdbc:postgresql://127.0.0.1:5432/highway_demo?currentSchema=public"
    # 若需与示例同构的本地演示库（sqlite），仅替换下面两行为：
    #   type: sqlite
    #   jdbc_url: jdbc:sqlite:data/highway_demo.db


object_types:

  - name: VehiclePassRecord
    display_name: 过车记录
    description: 过车记录聚合根：一辆车在一个车道从感知、识别、计费、交易、放行到生成流水的完整过程，其余列按关联对象拆分。
    role: aggregate_root
    properties:
      - name: id
        display_name: 自增主键
        data_type: string
        required: true
        unique: true
        primary_key: true
        description: 主键（uuid），过车记录唯一标识；既是本对象行身份，也是各投影对象的行身份
      - name: pass_id
        display_name: 过车唯一ID
        data_type: string
        required: true
        description: 过车唯一ID，取自 passId，用户标注为一次过车最合适的唯一键（如 0137012304232367582655 **** **** 2211）；站级流水按入口/出口各出一条记录时的 passId 分段口径需确认
      - name: trade_id
        display_name: 交易ID
        data_type: string
        required: false
        description: 交易ID，与站级数据库流水对应，如 G001537005003020209102026070112071625；失败或无交易时为空
      - name: waste_id
        display_name: 流水ID
        data_type: string
        required: false
        description: 流水ID（用户标注），日志中对应 WASTE_* 流水键，与 waste_generate_time（流水生成时间，消息/缓存服务）配套；无流水时为空
      - name: ext_attributes
        display_name: 扩展属性
        data_type: string
        required: false
        description: 扩展属性（JSON 文本），承载未单独入列的报文/位元实体字段，如入口站 EnStation/入口时间 EnTime、限重 LimitWeight；本次标注未归类，暂挂整体对象
      - name: create_time
        display_name: 记录创建时间
        data_type: date
        required: false
        description: 记录入库创建时间（DEFAULT CURRENT_TIMESTAMP）；本次标注未归类
      - name: update_time
        display_name: 记录更新时间
        data_type: date
        required: false
        description: 记录更新时间（DEFAULT CURRENT_TIMESTAMP）；本次标注未归类

      # ── 派生属性（通行级，载体列归属其他对象） ──
      - name: entry_time
        display_name: 进入收费车道时间
        data_type: date
        required: false
        description: 派生。即 T1 车辆到达时间；载体列 a1_frame_time 属 DeviceControlService，实际取值由 compute_pass_time_nodes 按车道类型判定（混合车道优先 A1，缺失退 min(plate_capture_time, b2_frame_time)；ETC 专用车道禁用 A1，否则耗时会出现负值——见规格 5.5 R1）
      - name: exit_time
        display_name: 驶离收费车道时间
        data_type: date
        required: false
        description: 派生。即 T4 车辆压过线圈（驶离）时间；载体列 detector7_time 属 VehicleDetector
      - name: total_fee
        display_name: 应收总金额
        data_type: int
        required: false
        description: 派生。等同物理列 fee（归属 BillingService·计费服务）；实收为 pay_fee，样例差额 798 与计费响应的 discountFee 一致
      - name: status
        display_name: 通行状态
        data_type: string
        required: false
        description: 派生。依据 error_code（交易特情码）、waste_id/waste_generate_time（流水）、gate_finish_time（抬杆到位即放行证据）组合判定；状态枚举（处理中/已放行/交易失败/特情待处理）来自原本体定义，生产库尚未见落库枚举，待定义后固化
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: id
      field_mapping:
        id: id
        pass_id: pass_id
        trade_id: trade_id
        waste_id: waste_id
        ext_attributes: ext_attributes
        create_time: create_time
        update_time: update_time
        # 派生属性 → 载体列（归属设备控制服务/车辆检测器/计费服务/交易服务，跨对象派生）
        entry_time: a1_frame_time
        exit_time: detector7_time
        total_fee: fee
        status: error_code

  # ═══════════════════════════════════════════════════════════════════════
  # 2 设施对象 · 收费站
  # ═══════════════════════════════════════════════════════════════════════

  - name: Station
    display_name: 收费站
    description: 收费站/门架维度（用户标注的设施对象之一），由归集表 station_id/station_name 投影，实例为本次通行所属收费站。
    role: dimension
    properties:
      - name: station_id
        display_name: 收费站/门架编号
        data_type: string
        required: false
        unique: true
        primary_key: true
        description: 收费站/门架 Hex 编号（用户标注），如 37016433
      - name: station_name
        display_name: 收费站名称
        data_type: string
        required: false
        description: 收费站中文名，如 山东王台站
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: station_id
      field_mapping:
        station_id: station_id
        station_name: station_name

  # ═══════════════════════════════════════════════════════════════════════
  # 3 设施对象 · 车道
  # ═══════════════════════════════════════════════════════════════════════

  - name: Lane
    display_name: 车道
    description: 车道维度（用户标注的设施对象之一），由归集表 lane_id/lane_hex/lane_type 投影；车道类型与线圈组合是过车慢分组与邻道干扰的前置条件。
    role: dimension
    properties:
      - name: lane_id
        display_name: 车道号
        data_type: string
        required: false
        description: 车道号（十进制），由车道 Hex 低字节换算，如 91
      - name: lane_hex
        display_name: 车道十六进制
        data_type: string
        required: false
        unique: true
        primary_key: true
        description: 车道 Hex 编号，取日志第二个中括号，如 370164335B
      - name: lane_type
        display_name: 车道类型
        data_type: string
        required: false
        description: 车道类型代码（样例 04 对应 ETC 专用车道、6 对应匝道），混合车道等取值以站级车道字典为准
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: lane_hex
      field_mapping:
        lane_id: lane_id
        lane_hex: lane_hex
        lane_type: lane_type

  # ═══════════════════════════════════════════════════════════════════════
  # 4 车辆对象（含下属通行介质）
  # ═══════════════════════════════════════════════════════════════════════

  - name: Vehicle
    display_name: 车辆
    description: 车辆维度（用户标注的车辆对象），由归集表车辆属性列投影；通行介质作为其下属对象见 TollMedium。
    role: dimension
    properties:
      - name: plate_no
        display_name: 车牌号
        data_type: string
        required: false
        unique: true
        primary_key: true
        data_classification: 2
        description: 交易/OBU 侧确认的车牌号，如 鲁UG6595；与 plate_capture_plate（牌识结果）不一致时需核查
      - name: plate_color
        display_name: 车牌颜色
        data_type: string
        required: false
        description: 车牌颜色代码。README.md 用 6000 条样本做车型×颜色交叉验证得到的码表为 0 蓝 / 1 黄 / 2 黑 / 3 白 / 4 绿 / 255 未上报（样例 1 即黄牌，与重卡一致）；厂商码表仍须生产侧确认
      - name: vehicle_type
        display_name: 车型
        data_type: string
        required: false
        description: 计费车型代码，按部标 JT/T 489 分类，样例 12 即两轴货；README.md 给出的映射为 1 轿车 / 2 中客 / 3 客车 / 4 大客 / 11 轻卡 / 12 两轴货 / 13 三轴货 / 14 四轴货 / 15 半挂五轴 / 16 半挂六轴 / 21–26 专项作业车。是过车慢 MAD 的分组键之一
      - name: actual_fee_class
        display_name: 实际收费类别
        data_type: string
        required: false
        description: 实际收费类别（用户标注）；位元实体 ActualFeeClass 样例 1，与 vehicle_type 比对可发现车型/费率不一致
      - name: vehicle_model
        display_name: 车辆型号/描述
        data_type: string
        required: false
        description: 车辆型号/描述（用户标注）；README.md 指出该字段在 749 条样本里恒为 0000，实际可用性低
      - name: axle_count
        display_name: 轴数
        data_type: int
        required: false
        description: 计费轴数（用户标注 TINYINT，物理列为 int2），样例 2
      - name: identify_axle_count
        display_name: 识别轴数
        data_type: int
        required: false
        description: 识别轴数，与 axle_count 不一致时可作为计重异常/特情线索
      - name: axle_type
        display_name: 轴型
        data_type: string
        required: false
        description: 轴型描述
      - name: vehicle_id
        display_name: 车辆ID
        data_type: string
        required: false
        description: 派生。车辆业务主体标识（别名映射 plate_no）；建议优先级为 完整 OBU > 卡号 > 车牌号+车牌颜色（《本体规格V1》2.3 的降级链无卡号级，两份依据不一致，落地前须统一）
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: plate_no
      field_mapping:
        plate_no: plate_no
        plate_color: plate_color
        vehicle_type: vehicle_type
        actual_fee_class: actual_fee_class
        vehicle_model: vehicle_model
        axle_count: axle_count
        identify_axle_count: identify_axle_count
        axle_type: axle_type
        vehicle_id: plate_no

  # ═══════════════════════════════════════════════════════════════════════
  # 5 通行介质对象（车辆下属：OBU / ETC卡 / CPC卡）
  # ═══════════════════════════════════════════════════════════════════════

  - name: TollMedium
    display_name: 通行介质
    description: 车辆下属的通行介质维度（用户标注的车辆对象下属成员），含 OBU 侧与 ETC/CPC 卡侧属性，由 media_type 判读；由归集表介质属性列投影。
    role: dimension
    properties:
      - name: obu_id
        display_name: OBU编号
        data_type: string
        required: false
        description: OBU 编号（用户标注，关联 OBU），如 3701084323005665，取 B2 帧 serialNumber；media_no 未必等于 OBU 编号（按介质类型取值）
      - name: obu_mac
        display_name: OBU的MAC
        data_type: string
        required: false
        description: OBU 侧 8 位 Hex 标识（用户标注 OBU MAC），如 3DF35ED4。本站日志中该值即《本体规格V1》2.3 所称 OBU ID 与交易分组键，与 obu_id 的口径需统一；禁止仅用 1 字节的截断字段做邻道干扰判定
      - name: obu_serial_number
        display_name: OBU序列号
        data_type: string
        required: false
        description: OBU 出厂序列号（用户标注），B2 帧 serialNumber，如 3701084323005665；与 obu_id 的差异待接口字典确认
      - name: card_no
        display_name: ETC卡号/CPU卡号
        data_type: string
        required: false
        description: ETC 卡号/CPU 卡号（用户标注），如 2304232367582655；与 media_no 的取值关系需按介质类型判定
      - name: media_no
        display_name: 介质编号/卡号
        data_type: string
        required: false
        unique: true
        primary_key: true
        description: 介质编号/卡号（用户标注），OBU 编号/ETC 卡号/CPC 卡号/车牌，按 media_type 判读
      - name: media_type
        display_name: 介质类型
        data_type: string
        required: false
        description: 介质类型（用户标注），样例 1 为 OBU；完整码表待生产字典确认
      - name: medium_id
        display_name: 通行介质ID
        data_type: string
        required: false
        description: 派生。通行介质ID（别名映射 media_no）
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: media_no
      field_mapping:
        obu_id: obu_id
        obu_mac: obu_mac
        obu_serial_number: obu_serial_number
        card_no: card_no
        media_no: media_no
        media_type: media_type
        medium_id: media_no

  # ═══════════════════════════════════════════════════════════════════════
  # 6 设备对象（车牌识别设备 / 栏杆机 / 车辆检测器）
  # ═══════════════════════════════════════════════════════════════════════

  - name: VehicleDetector
    display_name: 车辆检测器
    description: 车辆检测器（硬件）：车检器 1/2/6/7 的有信号与离开时间点，是 T1/T4 与耗时基线的来源。
    role: fact
    properties:
      - name: pass_record_id
        display_name: 通行记录标识
        data_type: string
        required: true
        unique: true
        primary_key: true
        description: 同行投影的行身份，取 vehicle_pass_record.id，用于与通行记录建立关联
      - name: detector1_time
        display_name: 车检器1时间
        data_type: date
        required: false
        description: 车检器 1 有信号时间（用户标注，关联车辆检测器）；ETC 车道第 1 个车辆检测器，混合车道无此线圈（README.md 线圈映射）
      - name: detector1_leave_time
        display_name: 车检器1离开时间
        data_type: date
        required: false
        description: 车检器 1 无信号（离开）时间（用户标注，关联车辆检测器）
      - name: detector2_time
        display_name: 车检器2时间
        data_type: date
        required: false
        description: 车检器 2 有信号时间（用户标注，关联车辆检测器）；ETC 车道第 2 个车辆检测器
      - name: detector2_leave_time
        display_name: 车检器2离开时间
        data_type: date
        required: false
        description: 车检器 2 无信号（离开）时间（用户标注，关联车辆检测器）
      - name: detector6_time
        display_name: 车检器6时间
        data_type: date
        required: false
        description: 车检器 6 有信号时间（用户标注，关联车辆检测器）；MTC/混合车道存在线圈，对应 A1 口径
      - name: detector6_leave_time
        display_name: 车检器6离开时间
        data_type: date
        required: false
        description: 车检器 6 无信号（离开）时间（用户标注，关联车辆检测器）
      - name: detector7_time
        display_name: 车检器7时间
        data_type: date
        required: false
        description: 车检器 7 有信号时间（用户标注，关联车辆检测器）；落杆线圈，ETC 与混合车道均有，对应时间节点 T4（车辆压过线圈驶离）
      - name: detector7_leave_time
        display_name: 车检器7离开时间
        data_type: date
        required: false
        description: 车检器 7 无信号（离开）时间（用户标注，关联车辆检测器）
    data_source:
      connection_id: "highway_demo"
      table: vehicle_pass_record
      id_column: id
      field_mapping:
        pass_record_id: id
        detector1_time: detector1_time
        detector1_leave_time: detector1_leave_time
        detector2_time: detector2_time
        detector2_leave_time: detector2_leave_time
        detector6_time: detector6_time
        detector6_leave_time: detector6_leave_time
        detector7_time: detector7_time
        detector7_leave_time: detector7_leave_time

  - name: PlateRecognitionDevice
    display_name: 车牌识别设备
    description: 车牌识别设备（硬件）：抓拍时间 B1 与牌识车牌，用于与交易侧车牌比对。
    role: fact
    properties:
      - name: pass_record_id
        display_name: 通行记录标识
        data_type: string
        required: true
        unique: true
        primary_key: true
        description: 同行投影的行身份，取 vehicle_pass_record.id，用于与通行记录建立关联
      - name: plate_capture_time
        display_name: 车牌抓拍时间
        data_type: date
        required: false
        description: 车牌抓拍时间（用户标注，关联车牌识别设备），对应时间节点 B1（建议取抓拍日志最后一行时间，而非报文内嵌拍摄时间）
      - name: plate_capture_plate
        display_name: 车牌抓拍车牌
        data_type: string
        required: false
