  <text x="1430.00" y="254.90" fill="#475569" font-family="inherit" font-size="11" text-anchor="middle">12:07:24</text>
  <text x="134.00" y="30.20" fill="#b42318" font-family="inherit" font-size="12" text-anchor="middle">picTime 15.000（报文内拍摄时间）</text>
  <text x="389.00" y="30.20" fill="#475569" font-family="inherit" font-size="12" text-anchor="middle">C1 首个 B2 帧 16.774</text>
  <text x="475.00" y="75.20" fill="#475569" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="600.00">T2 抬杆指令 17.266 / T3 真实到位 17.312</tspan><tspan font-weight="400.00">（barStaus=01，间隔 46ms ≥ a1 20ms → T3 可信）</tspan></text>
  <text x="546.00" y="360.20" fill="#b42318" font-family="inherit" font-size="12" text-anchor="middle">B1 抓拍上报 17.860（与 picTime 差 2860ms → 标 B1_LOW）</text>
  <text x="664.00" y="400.20" fill="#475569" font-family="inherit" font-size="12" text-anchor="middle">A1 车检器 1/2 有信号 18.679</text>
  <text x="1116.00" y="360.20" fill="#475569" font-family="inherit" font-size="12" text-anchor="middle">T4 车检器 7 有信号 21.820</text>
  <text x="1372.00" y="400.20" fill="#475569" font-family="inherit" font-size="12" text-anchor="middle">落杆到位 23.600</text>
  <text x="487.00" y="450.20" fill="#067647" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="400.00">口径 A（本轮：B1 = 抓拍上报行时间）elapsedBarrier = T3 − T1 = </tspan><tspan font-weight="600.00">538ms</tspan><tspan font-weight="400.00"> → 正常（冷启动 b1 货车 2s）</tspan></text>
  <text x="487.00" y="510.20" fill="#b42318" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="400.00">口径 B（若 B1 = 报文内 picTime）elapsedBarrier = </tspan><tspan font-weight="600.00">2312ms</tspan><tspan font-weight="400.00"> &gt; 2000ms → </tspan><tspan font-weight="600.00">过车慢</tspan><tspan font-weight="400.00">，根因 </tspan><tspan font-weight="600.00">天线扫描慢</tspan><tspan font-weight="400.00">（C1 − B1 = 1774ms &gt; c1 1s）</tspan></text>
  <text x="1136.00" y="570.20" fill="#475569" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="400.00">elapsedPass = T4 − T1 = </tspan><tspan font-weight="600.00">5046ms</tspan><tspan font-weight="400.00">（&lt; b2 货车 15s）→ 物理通过不判慢</tspan></text>
  <text x="375.00" y="450.20" fill="#475569" font-family="inherit" font-size="12" font-weight="600" text-anchor="end">口径 A</text>
  <text x="120.00" y="510.20" fill="#475569" font-family="inherit" font-size="12" font-weight="600" text-anchor="end">口径 B</text>
  <text x="375.00" y="570.20" fill="#475569" font-family="inherit" font-size="12" font-weight="600" text-anchor="end">物理通过</text>
  <text x="134.00" y="650.20" fill="#475569" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="600.00">为什么差 1774ms</tspan><tspan font-weight="400.00">：B1（抓拍上报行 17.860）比 C1（首个 B2 帧 16.774）晚 1086ms —— 上报延迟落在 B1 上；改回 picTime 后 T1 提前到 15.000，这段延迟就变成「检测 → 抬杆」的等待，于是同一趟从「正常」翻成「过车慢 + 天线扫描慢」。</tspan></text>
  <text x="134.00" y="690.20" fill="#b42318" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="600.00">T3 只认设备上报帧</tspan><tspan font-weight="400.00">：`设备信息|E4` 的「电动栏杆机抬杆到位」与 T2 指令同毫秒（17.266），取它会使 T3 − T2 = 0ms &lt; a1 → 误判 T3 不可信 → 整趟改用 b2 分支。</tspan></text>
  <text x="134.00" y="730.20" fill="#475569" font-family="inherit" font-size="12" font-weight="600">结论：同一份日志、同一趟车，两个口径给出相反结论。口径必须进字段、进清单、进每个结论的 evidence.caliber。</text>
</svg>
