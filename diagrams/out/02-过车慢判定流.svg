  <text x="17.00" y="1567.90" fill="#b42318" font-family="inherit" font-size="11">陷阱：设备信息|E4 的「电动栏杆机抬杆到位」时间与 T2 指令同毫秒，取它会把 T3−T2 变成 0ms → 误判 T3 不可信 → 整趟换口径。T3 只认 barStaus=01 帧。</text>
