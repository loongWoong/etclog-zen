  <text x="17.00" y="1118.20" fill="#b42318" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="600.00">实测（2026-07-01 12 时·单站）</tspan><tspan font-weight="400.00">：完整 OBU 127 个（78 个跨车道），</tspan><tspan font-weight="600.00">5 秒内跨车道 0 对</tspan><tspan font-weight="400.00"> —— 方案原「场景一（5s 同 OBU）」在本站几乎不产出，主判据必须落在场景二。</tspan></text>
  <text x="17.00" y="1153.20" fill="#475569" font-family="inherit" font-size="12" xml:space="preserve"><tspan font-weight="600.00">样例</tspan><tspan font-weight="400.00">：OBU 3DF35ED4 在 12:06:54.5 被 95 车道（匝道）读到、E1 因「货车不允通行」失败；12:07:16.8 在 91 车道重做并成功 —— 这是同一次通行，不是邻道干扰。</tspan></text>
